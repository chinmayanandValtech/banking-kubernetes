apiVersion: apps/v1
kind: Deployment

metadata:
  name: config-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: config-server

  template:
    metadata:
      labels:
        app: config-server

    spec:
      containers:
        - name: config-server
          image: chinmayanand5613/config-server:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8888

          env:
            - name: EUREKA_URL
              value: http://service-registry:8761/eureka
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin:9411/api/v2/spans